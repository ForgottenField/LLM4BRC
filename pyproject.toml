[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4brc"
version = "0.1.0"
description = "LLM-assisted false-positive classification for static-analysis reports"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "openai>=1.0,<3",
  "pydantic>=2,<3",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-c>=0.23,<0.25",
  "tree-sitter-cpp>=0.23,<0.24",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = [
  "anthropic>=0.40",
  "pytest>=8",
  "ruff>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "csa_analysis*",
  "fp_analysis*",
  "llm_client*",
  "pipeline*",
  "report_frontend*",
  "tree_sitter_backend*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F"]
